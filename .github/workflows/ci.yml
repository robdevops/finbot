name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited] # edited: the base branch can change
  schedule:
    - cron: '23 19 * * 0' # weekly (Sunday, UTC): catches upstream package changes between commits
  workflow_dispatch: # manual run from the Actions tab

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.x', '3.13.5'] # latest release, and the production version
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the base branch is needed to see what a pull request changes
      - id: changes
        name: Classify the change
        # A pull request that only touches docs skips the steps below. The job still runs and reports success, so the
        # required checks pass at once. Pushes to main, the weekly run and manual runs always test everything.
        # Only a non-empty list of allowlisted paths skips the tests; any git error fails the step. The allowlist must
        # never include a path a test reads.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          docs_only=false
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            files=$(git -c core.quotePath=false diff --name-only --no-renames "origin/$BASE_REF...HEAD")
            echo "$files"
            docs='^(README\.md|CLAUDE\.md|doc/[^/]+\.md|img/[^/]+\.png)$'
            if [ -n "$files" ] && ! grep -qvE "$docs" <<< "$files"; then
              docs_only=true
              echo "::notice::Only docs changed: install, compile and tests are skipped"
            fi
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
      - if: steps.changes.outputs.docs_only != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - if: steps.changes.outputs.docs_only != 'true'
        name: The charts' font
        # the golden images are drawn in DejaVu Sans, as the image and a Debian host draw them
        run: |
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf \
            || { sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-dejavu-core; }
      - if: steps.changes.outputs.docs_only != 'true'
        run: |
          pip install -r requirements.txt -r requirements-optional.txt
          python -m compileall -q *.py lib util
          python -m unittest discover -s tests -v -b

  docker:
    # The image built as a Docker host builds it, from Debian's packages: a package renamed or gone fails here before
    # production meets it. Then every module imports in it, and the container starts as compose.yaml starts it.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the base branch is needed to see what a pull request changes
      - id: changes
        name: Classify the change
        # As in the test job: a pull request that only touches docs skips the steps below.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          docs_only=false
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            files=$(git -c core.quotePath=false diff --name-only --no-renames "origin/$BASE_REF...HEAD")
            docs='^(README\.md|CLAUDE\.md|doc/[^/]+\.md|img/[^/]+\.png)$'
            if [ -n "$files" ] && ! grep -qvE "$docs" <<< "$files"; then
              docs_only=true
            fi
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
      - if: steps.changes.outputs.docs_only != 'true'
        name: Build the image
        run: |
          docker build --build-arg GIT_COMMIT="$GITHUB_SHA" -t finbot .
          docker image ls finbot --format 'The image is {{.Size}}'
      - if: steps.changes.outputs.docs_only != 'true'
        name: Every module imports in the image, the optional libraries too, a chart draws, and the log names the commit
        run: |
          docker run --rm -i --read-only --tmpfs /tmp -e DATA_DIR=/tmp/data finbot python3 - <<'EOF'
          import importlib, os, pkgutil, bot, lib, lib.reports
          for package in (lib, lib.reports):
              for module in pkgutil.iter_modules(package.__path__, package.__name__ + '.'):
                  importlib.import_module(module.name)
          import nacl, waitress, websocket
          from lib import render
          assert render._font_file(False) and render._font_file(True), 'no DejaVu Sans in the image'
          assert render.draw_pie(render.Chart('pie', rows=(('a', 1.0),))).read(4) == b'\x89PNG'
          assert bot.git_version() == os.environ['FINBOT_COMMIT'][:7], bot.git_version()
          print('every module imports, a chart draws; finbot', bot.git_version())
          EOF
      - if: steps.changes.outputs.docs_only != 'true'
        name: The container starts as compose starts it, copies the defaults, reloads and flushes
        run: |
          data="$RUNNER_TEMP/finbot-data"
          mkdir "$data" && sudo chown 10001:10001 "$data"
          docker run -d --name finbot --init --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges:true --pids-limit 256 --memory 400m --memory-swap 400m \
            -e DATA_DIR=/data -v "$data:/data" -v "$PWD/defaults/finbot.env:/run/finbot.env:ro" finbot
          wait_for() { # the log saved first: grep -q would cut docker logs off mid-write, which pipefail counts
            for _ in $(seq 60); do
              docker logs finbot > "$RUNNER_TEMP/log" 2>&1
              grep -q "$1" "$RUNNER_TEMP/log" && return 0
              sleep 1
            done
            cat "$RUNNER_TEMP/log"
            echo "::error::never logged: $1"
            return 1
          }
          wait_for 'finbot is running'
          test -f "$data/settings.conf"
          docker kill -s HUP finbot
          wait_for 'config: reloaded'
          docker kill -s USR1 finbot
          wait_for 'cache: flushed'
          docker rm -f finbot
      - if: steps.changes.outputs.docs_only != 'true'
        name: A mistake in the startup file stops the container before the bot starts
        run: |
          printf 'telegramBotTokn=x\n' > "$RUNNER_TEMP/bad.env"
          if docker run --rm --read-only --tmpfs /tmp -e DATA_DIR=/tmp \
              -v "$RUNNER_TEMP/bad.env:/run/finbot.env:ro" finbot > "$RUNNER_TEMP/out" 2>&1; then
            cat "$RUNNER_TEMP/out"
            echo "::error::the container started with a mistake in its startup file"
            exit 1
          fi
          cat "$RUNNER_TEMP/out"
          grep -q 'unknown key telegramBotTokn' "$RUNNER_TEMP/out"
          if grep -q 'finbot is running' "$RUNNER_TEMP/out"; then
            echo "::error::the bot started with a mistake in its startup file"
            exit 1
          fi

  notify:
    # Telegram alert when the weekly run fails. Needs repository secrets TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID.
    needs: [test, docker]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - name: Send Telegram message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::warning::TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID secrets are not set; no notification sent"
            exit 0
          fi
          curl -sS --fail-with-body "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "disable_web_page_preview=true" \
            --data-urlencode "text=⚠️ ${GITHUB_REPOSITORY}: weekly tests failed
          ${RUN_URL}" > /dev/null

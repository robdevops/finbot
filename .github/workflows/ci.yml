name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 19 * * 0' # weekly (Sunday, UTC): catches upstream package changes between commits
  workflow_dispatch: # manual run from the Actions tab

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.x', '3.13.5'] # latest release, and the production version
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q bot.py *.py lib util
      - run: python -m unittest discover -s tests -v

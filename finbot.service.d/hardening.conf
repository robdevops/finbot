# Optional hardening for finbot.service: a sandbox and resource limits. Install it next to the unit:
#   sudo mkdir -p /etc/systemd/system/finbot.service.d
#   sudo cp /opt/finbot/finbot.service.d/hardening.conf /etc/systemd/system/finbot.service.d/
#   sudo systemctl daemon-reload && sudo systemctl restart finbot
# Remove the file and restart to go back to the plain unit if the sandbox ever gets in the way.
# It needs the Git checkout outside /home (ProtectHome=yes) and finbot's state in the unit's StateDirectory, the only
# place it can write.
[Service]
# Filesystem isolation
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
InaccessiblePaths=/boot /media /mnt
UMask=0077

# Privilege restrictions
AmbientCapabilities=
CapabilityBoundingSet=
LockPersonality=yes
# No JIT or other code generated at run time: finbot and its libraries need none
MemoryDenyWriteExecute=yes
NoNewPrivileges=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
SystemCallArchitectures=native
SystemCallErrorNumber=EPERM
SystemCallFilter=@system-service

# Kernel and system protection
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes

# Process isolation
PrivateUsers=yes
ProtectProc=invisible
RestrictNamespaces=yes

# Network restrictions: HTTPS out; in push mode, finbot listens on one local port
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6

# Resource limits: starting values; read MemoryPeak and TasksCurrent from systemctl show finbot, then tune. Tasks are
# threads: one per message, button press, scheduled job and chart priming, and many jobs can fire in the same minute
MemoryAccounting=yes
MemoryHigh=300M
MemoryMax=400M
TasksMax=256

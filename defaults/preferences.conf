# Preferences for finbot: how the bot behaves. This file is only the template, which finbot never reads: the bot
# reads <DATA_DIR>/preferences.conf, at start and on every reload, and without one runs on its built-in defaults.
# util/sync_defaults.py --apply copies this file there.
# Each key is commented out at its built-in default: to change one, remove its # and edit the value.
#   Apply an edit without a restart:  sudo systemctl reload finbot     (docker: docker compose kill -s HUP finbot)
#   Check an edit first:              util/check_config.py /path/to/finbot.env
# Flat KEY=value lines, one per line. This is NOT an INI file: no [sections]. No spaces around "=", no quotes, no
# trailing comments; put comments on their own line. A key that is not listed here is an error and finbot refuses to
# start.
# The startup keys (credentials, ip, port, telegramChatID, ...) are NOT set here: they live in finbot.env, the startup
# file, which the launcher loads and the bot never reads. Changing them needs a restart.

# Reports: how far back and forward to look, and when to alert
#past_days=28
#future_days=30
#price_percent=5
#shorts_percent=15
# .buy, .sell and .forward pe list only stocks that at least this many analysts cover: with fewer, a consensus says
# little
#min_analysts=7
# price alerts: volatile and leveraged stocks need a bigger move; volatility_multiplier is how much bigger for
# volatile ones
#demote_volatile=True
#demote_leveraged=True
#volatility_multiplier=2

# Which portfolios to report on, space separated Sharesight portfolio IDs (empty: all that are not excluded)
#exclude_portfolios=
#include_portfolios=

# Data sources: set trades_use_yahoo to False if Yahoo breaks
#trades_use_yahoo=True

# Display
#graph=True
#hyperlink=True
#hyperlinkFooter=True
#hyperlinkProvider=google

# Regional: where you are.
# exchange_suffix: a ticker Yahoo does not know is tried again on your exchange, by Yahoo's suffix for it (AX: BHP is
# tried as BHP.AX; NZ, L, TO and so on for others). Empty: a ticker is taken as written.
# country_code and timezone: the reminder report's country and time zone; .jobs also shows each next run in timezone.
#exchange_suffix=AX
#country_code=AU
#timezone=Australia/Melbourne

# Caching and network, in seconds
#cache=True
#cache_seconds=43200
#performance_cache_seconds=2400
#http_timeout=18

# Diagnostics
#debug=False
#print_headers=False

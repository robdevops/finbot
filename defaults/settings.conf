# finbot settings: how the bot behaves.
#
# This is only the template; finbot never reads it. The bot reads <DATA_DIR>/settings.conf at
# start and on every reload, and runs on its built-in defaults without one.
# util/sync_defaults.py --apply copies this file there.
#
# Every key below is commented out at its default: remove the # to change one.
#   Apply an edit:  sudo systemctl reload finbot   (docker: docker compose kill -s HUP finbot)
#   Check it first: util/check_config.py /path/to/finbot.env
#
# Format: one KEY=value per line. Not an INI file: no [sections], no spaces around "=",
# no quotes, no trailing comments (comments go on their own line). An unknown key stops
# the start.
# Credentials, ip and port are not set here but in finbot.env, which needs a restart.

# Admins: the commands only they may use (admin_only: command names, space separated), and
#   who they are (admins: space separated, each network:id as the log shows the sender:
#   telegram:@username or the user id, slack:U0123ABCD, discord:123456789012345678).
#   Closed by default: only the admins may use /jobs, and no one is an admin.
#admin_only=jobs
#admins=

# Reports: how far to look back and forward, and when to alert
#past_days=28
#future_days=30
#price_percent=5
#shorts_percent=15
# .buy, .sell and .forward pe list only stocks covered by at least this many analysts
#min_analysts=7
# Movers: volatile and leveraged stocks need a bigger move, by volatility_multiplier
#demote_volatile=True
#demote_leveraged=True
#volatility_multiplier=2

# Portfolios to report on: Sharesight portfolio IDs, space separated (empty: all not excluded)
#exclude_portfolios=
#include_portfolios=

# Data sources: set trades_use_yahoo to False if Yahoo breaks
#trades_use_yahoo=True

# Display
#graph=True
#hyperlink=True
#hyperlinkFooter=True
#hyperlinkProvider=google

# Regional
# exchange_suffix: a ticker Yahoo does not know is retried with your exchange's suffix
#   (AX: BHP is tried as BHP.AX; NZ, L, TO and so on for others). Empty: taken as written.
# country_code: for the default jobs' messages meant for one country (AU: tax year reminders)
# timezone: the clock of the times .jobs takes and shows, and of a job that names no zone
#exchange_suffix=AX
#country_code=AU
#timezone=Australia/Melbourne

# Caching and network, in seconds
#cache=True
#cache_seconds=21600
#performance_cache_seconds=2400
#http_timeout=18

# Diagnostics
# log_level: ERROR, WARN, INFO (what finbot does, and each request it sends) or DEBUG
#   (each cache miss, hit and write too); the log shows that level and those above it
# log_width: the most characters of a long log line (a request, a chat message), cut with
#   an ellipsis (…); 0 cuts none
#log_level=INFO
#log_width=71
#print_headers=False

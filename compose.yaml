# finbot with Docker Compose (doc/docker.md). The configuration lives outside the image and the container:
# /etc/finbot.env, the startup env, and ../finbot-data beside the checkout, DATA_DIR (settings.conf, state and cache),
# both made by util/docker_setup.sh. Build and start: docker compose up -d --build
services:
  finbot:
    build:
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown} # GIT_COMMIT=$(git rev-parse HEAD), for the version in the log
    image: finbot
    container_name: finbot
    restart: unless-stopped
    env_file: /etc/finbot.env
    environment:
      DATA_DIR: /data
      ip: 0.0.0.0 # push mode listens inside the container: publish its port below
    volumes:
      - ../finbot-data:/data
      - /etc/finbot.env:/run/finbot.env:ro # checked before the bot starts
    # ports: # push mode only, on the host's loopback, behind your reverse proxy
    #   - 127.0.0.1:5000:5000
    logging:
      driver: ${FINBOT_LOG_DRIVER:-local} # journald where util/docker_setup.sh found one (it writes .env); else local
    # hardening: the bot needs none of what these take away
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 400m
    memswap_limit: 400m # no swap on top
    init: true # passes SIGHUP and SIGUSR1 on to the bot, and reaps children
